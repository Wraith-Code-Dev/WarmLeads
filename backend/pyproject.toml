[project]
name = "backend"
version = "0.1.0"
description = "WarmLeads Backend API and Scraper Pipeline"
readme = "README.md"
authors = [
    { name = "AnshulParate2004", email = "anshulnparate@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "google-api-python-client>=2.124.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.27.0",
    "litellm>=1.34.0",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "uvicorn[standard]>=0.28.0",
    "aiosqlite>=0.22.1",
    "pyjwt>=2.13.0",
    "feedparser>=6.0.11",
    "curl-cffi>=0.16.0",
    "selectolax>=0.4.11",
    "python-jobspy>=1.1.80",
    "crawl4ai>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
