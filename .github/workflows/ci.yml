name: WarmLeads CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Python 3.12 / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Integration Suite (21 Tests)
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          POOLED_DB_URL: sqlite+aiosqlite:///:memory:
          DIRECT_DB_URL: sqlite+aiosqlite:///:memory:
          CRON_SECRET: test_cron_secret_warmleads
        run: pytest -v

  frontend-ci:
    name: Frontend (Node 20 / TypeScript / Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Lint Check (ESLint)
        run: npm run lint

      - name: Production Build Test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key_for_ci
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build
